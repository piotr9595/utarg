<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Utarg</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f5f7;color:#17191d}.app{max-width:620px;margin:auto;padding:14px 14px 40px}.top{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:12px}.card{background:#fff;border:1px solid #dfe2e7;border-radius:16px;padding:14px;margin-bottom:12px}.label{font-size:13px;font-weight:700;color:#555b66;margin-bottom:6px}.big{font-size:26px;font-weight:800}.muted{font-size:13px;color:#6b7280}input,select,button{font:inherit}input,select{width:100%;min-height:48px;border:1px solid #ccd1d8;border-radius:12px;background:#fff;padding:0 12px;font-size:16px}.services{display:grid;grid-template-columns:1fr 1fr;gap:9px}.service,.secondary,.danger{min-height:58px;border:1px solid #ccd1d8;border-radius:13px;background:#fff;padding:10px;text-align:left}.service.on{border:2px solid #111827;background:#eef0f3}.service b{display:block}.service small{color:#6b7280}.custom{display:flex;gap:8px}.custom input{min-width:0}.custom button{min-width:90px}.primary{width:100%;min-height:54px;border:0;border-radius:13px;background:#111827;color:#fff;font-weight:800;font-size:17px}.secondary{min-height:48px;text-align:center;font-weight:700}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}.weekhead{display:flex;justify-content:space-between;font-weight:800;padding-bottom:8px}.row{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid #eceef1}.grow{flex:1;min-width:0}.name{font-weight:750;overflow-wrap:anywhere}.amount{font-weight:800;white-space:nowrap}.delete{width:44px;height:44px;border:1px solid #d5d8dd;background:#fff;border-radius:10px;font-size:22px}.footer-actions{display:flex;gap:8px}.footer-actions button{flex:1}.msg{min-height:18px;margin-top:8px}.selected{display:flex;justify-content:space-between;gap:10px;align-items:center}.selectedText{overflow-wrap:anywhere}.monthbar{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:24px;margin:0 0 2px}h2{font-size:16px;margin:0}@media(max-width:350px){.services,.summary{grid-template-columns:1fr}.top{align-items:stretch;flex-direction:column}}
</style></head><body><main class="app"><h1>Utarg</h1><div class="muted" style="margin-bottom:14px">Kalkulator detailingu</div>
<div class="card top"><label style="flex:1"><div class="label">Tydzień</div><select id="week"><option value="1">Tydzień 1</option><option value="2">Tydzień 2</option><option value="3">Tydzień 3</option><option value="4">Tydzień 4</option><option value="5">Tydzień 5</option></select></label><div><div class="muted">Ten tydzień</div><div id="weekTotal" class="big">0 zł</div></div></div>
<form id="form"><div class="card"><div class="label">Samochód / opis</div><input id="car" placeholder="np. Cupra, Q5, Tiggo 7" autocomplete="off"></div>
<div class="card"><div class="label">Wybierz usługę — możesz kilka</div><div class="services"><button type="button" class="service" data-name="2-letnia" data-price="2000"><b>2-letnia</b><small>2000 netto</small></button><button type="button" class="service" data-name="5-letnia" data-price="4000"><b>5-letnia</b><small>4000 netto</small></button><button type="button" class="service" data-name="1 etap" data-price="700"><b>1 etap</b><small>700 netto</small></button><button type="button" class="service" data-name="2 etap" data-price="1000"><b>2 etap</b><small>1000 netto</small></button></div></div>
<div class="card"><div class="label">Inna kwota netto</div><div class="custom"><input id="custom" type="number" inputmode="numeric" min="1" step="1" placeholder="np. 600"><button id="customAdd" type="button" class="secondary">Dodaj</button></div></div>
<div class="card selected"><div class="grow"><div class="muted">Wybrane dla auta</div><div id="selectedText" class="selectedText">Nic nie wybrano</div></div><div id="carTotal" class="big">0 zł</div></div><button class="primary" type="submit">DODAJ AUTO</button><div id="msg" class="muted msg" aria-live="polite"></div></form>
<div class="summary"><div class="card"><div class="muted">UTARG MIESIĄCA</div><div id="total" class="big">0 zł</div></div><div class="card"><div class="muted">SOBOTY</div><div id="satTotal" class="big">0 zł</div><div id="satCount" class="muted">0 × 285 brutto</div></div></div>
<button id="sat" class="secondary" style="width:100%;margin-bottom:14px">+ SOBOTA — 285 zł brutto</button>
<div class="monthbar"><h2>Miesiąc</h2><button id="reset" class="secondary">Nowy miesiąc</button></div><div id="list" style="margin-top:10px"></div>
</main><script>
(()=>{const KEY='utarg-detailing-v1';let state={entries:[],saturdays:0};let selected=[];const q=s=>document.querySelector(s),qa=s=>[...document.querySelectorAll(s)],money=n=>new Intl.NumberFormat('pl-PL').format(n)+' zł';try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.entries))state={entries:x.entries,saturdays:Number(x.saturdays)||0}}catch(e){}const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const esc=s=>{const d=document.createElement('div');d.textContent=s;return d.innerHTML};const selTotal=()=>selected.reduce((a,x)=>a+x.price,0);
function renderSel(){q('#carTotal').textContent=money(selTotal());q('#selectedText').textContent=selected.length?selected.map(x=>`${x.name} (${money(x.price)})`).join(' + '):'Nic nie wybrano';qa('.service').forEach(b=>b.classList.toggle('on',selected.some(x=>x.key===b.dataset.name)))}
function render(){const w=Number(q('#week').value);q('#weekTotal').textContent=money(state.entries.filter(x=>x.week===w).reduce((a,x)=>a+x.total,0));q('#total').textContent=money(state.entries.reduce((a,x)=>a+x.total,0));q('#satTotal').textContent=money(state.saturdays*285);q('#satCount').textContent=`${state.saturdays} × 285 brutto`;if(!state.entries.length){q('#list').innerHTML='<div class="card muted">Nie masz jeszcze żadnych wpisów.</div>';return}let h='';for(let i=1;i<=5;i++){const a=state.entries.filter(x=>x.week===i);if(!a.length)continue;h+=`<section class="card"><div class="weekhead"><span>Tydzień ${i}</span><span>${money(a.reduce((s,x)=>s+x.total,0))}</span></div>`;a.forEach(x=>h+=`<div class="row"><div class="grow"><div class="name">${esc(x.car)}</div><div class="muted">${x.services.map(s=>esc(s.name)).join(' + ')}</div></div><div class="amount">${money(x.total)}</div><button type="button" class="delete" data-del="${x.id}" aria-label="Usuń">×</button></div>`);h+='</section>'}q('#list').innerHTML=h;qa('[data-del]').forEach(b=>b.onclick=()=>{state.entries=state.entries.filter(x=>String(x.id)!==b.dataset.del);save();render()})}
qa('.service').forEach(b=>b.onclick=()=>{const k=b.dataset.name,i=selected.findIndex(x=>x.key===k);if(i>=0)selected.splice(i,1);else selected.push({key:k,name:k,price:Number(b.dataset.price)});renderSel()});q('#customAdd').onclick=()=>{const v=Number(q('#custom').value);if(!Number.isFinite(v)||v<=0){q('#msg').textContent='Wpisz prawidłową kwotę.';return}selected.push({key:'c'+Date.now(),name:'Inna kwota',price:v});q('#custom').value='';q('#msg').textContent='';renderSel()};q('#form').onsubmit=e=>{e.preventDefault();const car=q('#car').value.trim();if(!car){q('#msg').textContent='Wpisz nazwę auta.';return}if(!selected.length){q('#msg').textContent='Wybierz usługę albo dodaj inną kwotę.';return}state.entries.push({id:Date.now(),week:Number(q('#week').value),car,services:selected.map(x=>({...x})),total:selTotal()});save();q('#car').value='';selected=[];renderSel();render();q('#msg').textContent='Dodano.';q('#car').focus()};q('#week').onchange=render;q('#sat').onclick=()=>{state.saturdays++;save();render()};q('#reset').onclick=()=>{if((state.entries.length||state.saturdays)&&!confirm('Wyczyścić cały miesiąc?'))return;state={entries:[],saturdays:0};selected=[];save();renderSel();render()};renderSel();render()})();
</script></body></html>
